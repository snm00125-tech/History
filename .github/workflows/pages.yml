# web/ 정적 사이트를 빌드해 gh-pages 브랜치에 올린다 (GitHub Pages: Deploy from a branch → gh-pages / root)
name: 사이트 배포

on:
  push:
    branches: [claude/beautiful-curie-1r229o, ccr-f01d23da-xjt6dw]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 빌드
        working-directory: web
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run typecheck
          npm run build
          touch out/.nojekyll
      - name: gh-pages 브랜치에 올리기
        working-directory: web/out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "배포 ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
